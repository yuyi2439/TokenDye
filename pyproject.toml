[project]
name = "tokendye"
version = "0.3.0a"
description = "TokenDye: a lightweight way to dye LLM hidden states with role labels"
readme = "README.md"
authors = [
    { name = "Yausen", email = "yuyi2439@qq.com" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.13.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]
example = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.1",
    "transformers>=5.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["BLE001"]
